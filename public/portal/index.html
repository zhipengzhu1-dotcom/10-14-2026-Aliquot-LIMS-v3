<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e7e5df" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Client portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Critical CSS for the splash: paints on the first frame, before any script or stylesheet arrives. -->
  <style>
    @font-face { font-family: "Montserrat"; font-weight: 300 800; font-display: swap; src: url("/assets/fonts/montserrat-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400 700; font-display: swap; src: url("/assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    :root {
      --bg: #e7e5df; --ink: #131312; --muted: #6d6a63; --line: #d3d0c8; --slab: #161615; --slab-text: #f2f0ea; --lime: #c4f135;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0c0c0b; --ink: #ece9e1; --muted: #8a867c; --line: #2b2a26; --slab: #ece9e1; --slab-text: #121211; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0c0c0b; --ink: #ece9e1; --muted: #8a867c; --line: #2b2a26; --slab: #ece9e1; --slab-text: #121211; color-scheme: dark; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 450 15px/1.5 "Montserrat", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); transition: opacity .28s ease, visibility 0s linear .28s; }
    .splash.is-done { opacity: 0; visibility: hidden; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; animation: splash-in .42s cubic-bezier(.2,.7,.2,1) both; }
    .splash-mark { width: 48px; height: 48px; display: block; }
    .splash-mark .sq { fill: var(--slab); }
    .splash-mark .ink { stroke: var(--slab-text); }
    .splash-mark .fill { fill: var(--lime); }
    .splash-name { margin-top: 22px; min-height: 20px; font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; transition: opacity .3s ease; }
    .splash-name:empty { opacity: 0; }
    .splash-sub, .splash-foot { font: 500 10px/1.4 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .splash-sub { margin-top: 6px; }
    .splash-track { position: relative; width: 132px; height: 2px; margin-top: 26px; background: var(--line); overflow: hidden; opacity: 0; animation: splash-show .2s ease .15s forwards; }
    .splash-track span { position: absolute; inset: 0 auto 0 0; width: 38%; background: linear-gradient(90deg, var(--ink) 78%, var(--lime) 78%); animation: splash-slide 1.109s cubic-bezier(.37,0,.63,1) infinite alternate; }
    .splash-foot { position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px; text-align: center; animation: splash-in .42s ease .1s both; }
    .splash-foot svg { flex: none; }
    @keyframes splash-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes splash-show { to { opacity: 1; } }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(265%); } }
    @media (prefers-reduced-motion: reduce) {
      .splash, .splash-name { transition: none; }
      .splash-inner, .splash-foot { animation: none; }
      .splash-track { animation: splash-show 0s linear .15s forwards; }
      .splash-track span { width: 100%; opacity: .45; animation: none; }
    }
    @media print { .splash { display: none; } }
  </style>
  <script src="/portal/boot.js"></script>
  <link rel="stylesheet" href="/portal/portal.css">
  <link rel="stylesheet" href="/assets/lock.css">
  <script type="module" src="/portal/portal.js"></script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Loading the client portal">
    <div class="splash-inner">
      <svg class="splash-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="sq" width="32" height="32" rx="1"/>
        <path class="ink" d="M12 6.5h8M13.5 6.5v12a2.5 2.5 0 0 0 5 0v-12" fill="none" stroke-width="2.2" stroke-linecap="square"/>
        <path class="fill" d="M13.5 14.5h5v4a2.5 2.5 0 0 1-5 0z"/>
        <rect class="fill" x="14.6" y="24.4" width="2.8" height="2.8"/>
      </svg>
      <div class="splash-name" id="splash-name">Welcome</div>
      <div class="splash-sub">Secure client portal</div>
      <div class="splash-track" aria-hidden="true"><span></span></div>
    </div>
    <div class="splash-foot">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span id="splash-trust">Access-controlled · 21 CFR Part 11 audit trail</span>
    </div>
  </div>
  <div id="app"></div>
  <noscript><p style="text-align:center;padding:40px 16px">The client portal needs JavaScript enabled.</p></noscript>
</body>
</html>
